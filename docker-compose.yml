version: '3.8'

services:
  openmusic-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEVICE=cpu
      - DEBUG=false
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
    command: ["python", "-m", "app.main"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  openmusic-ui:
    build: .
    ports:
      - "7860:7860"
    environment:
      - DEVICE=cpu
      - DEBUG=false
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
    command: ["python", "-m", "app.ui.interface"]
    depends_on:
      - openmusic-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  outputs:
  models: